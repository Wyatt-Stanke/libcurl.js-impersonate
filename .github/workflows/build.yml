name: Build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up emsdk
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest
          actions-cache-folder: .emsdk-cache

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build autoconf automake libtool pkg-config wget python3 golang-go

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

    #   - name: Restore build cache
    #     id: build-cache
    #     uses: actions/cache@v5
    #     with:
    #       path: libcurl.js/client/build
    #       key: deps-${{ runner.os }}-${{ hashFiles('patches/**', 'tools/**', 'curl-impersonate/patches/**') }}
    #       restore-keys: |
    #         deps-${{ runner.os }}-

      - name: Build
        run: pnpm build